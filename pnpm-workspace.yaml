packages:
  - 'packages/*'

# No dependency build scripts are approved.
#
# Rationale (verified in this environment): the DSH file sandbox blocks any
# child process that captures output through piped stdio, so bundlers such as
# esbuild (which spawns its platform binary with stdio: 'pipe') fail with EPERM.
# The project is therefore deliberately BUILD-LESS: plain ESM JavaScript, no JSX,
# no bundler. See PROJECT.md "Build-less decision".
allowBuilds: { esbuild: set this to true or false }
